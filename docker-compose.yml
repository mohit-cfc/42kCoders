services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: dhundho
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - dhundho_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dhundho"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: ./apps/backend
    ports:
      - "8000:8000"
    # Single source of truth for keys — same file local `uv run` uses. DATABASE_URL below
    # overrides the file's localhost value so the container reaches the `db` service.
    env_file: ./apps/backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/dhundho
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@dhundho.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - dhundho_pgadmin:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

volumes:
  dhundho_db:
  dhundho_pgadmin:
